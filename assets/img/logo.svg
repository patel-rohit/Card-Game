<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Points Game">
  <defs>
    <radialGradient id="felt" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#23a86a"/>
      <stop offset=".55" stop-color="#0c6a43"/>
      <stop offset="1" stop-color="#05361f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e08f"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a8841f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efece0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- felt tile with gold rim -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#felt)"/>
  <rect x="7.5" y="7.5" width="113" height="113" rx="25" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- fan of three cards -->
  <g filter="url(#shadow)">
    <g transform="rotate(-22 64 104)">
      <rect x="43" y="26" width="42" height="60" rx="6" fill="url(#card)" stroke="#d4af37" stroke-width="1.6"/>
      <text x="49" y="40" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#c62828">♦</text>
    </g>
    <g transform="rotate(22 64 104)">
      <rect x="43" y="26" width="42" height="60" rx="6" fill="url(#card)" stroke="#d4af37" stroke-width="1.6"/>
      <text x="70" y="40" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#c62828">♥</text>
    </g>
    <g>
      <rect x="43" y="22" width="42" height="62" rx="6" fill="url(#card)" stroke="#d4af37" stroke-width="1.8"/>
      <text x="48.5" y="35.5" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#1d1d1f">A</text>
      <path d="M64 41c4.8 6.2 12.8 10.4 12.8 17.6 0 4.6-3.6 7.6-7.4 7.6-2.2 0-3.9-.9-4.9-2.3.5 3.6 1.9 6 4.4 8.1H59.1c2.5-2.1 3.9-4.5 4.4-8.1-1 1.4-2.7 2.3-4.9 2.3-3.8 0-7.4-3-7.4-7.6C51.2 51.4 59.2 47.2 64 41z" fill="#1d1d1f"/>
    </g>
  </g>

  <!-- gold scoring chip -->
  <g filter="url(#shadow)">
    <circle cx="92" cy="94" r="17" fill="url(#gold)"/>
    <circle cx="92" cy="94" r="13" fill="none" stroke="#7a5c10" stroke-width="1.6" stroke-dasharray="4 3.2"/>
    <text x="92" y="100.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#3a2a06">P</text>
  </g>
</svg>
