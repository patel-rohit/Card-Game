<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Points Game">
  <defs>
    <radialGradient id="felt" cx="50%" cy="25%" r="85%">
      <stop offset="0" stop-color="#26b072"/>
      <stop offset=".6" stop-color="#0c6a43"/>
      <stop offset="1" stop-color="#04301c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9a6"/>
      <stop offset=".5" stop-color="#d9b23a"/>
      <stop offset="1" stop-color="#a07c18"/>
    </linearGradient>
    <clipPath id="tile"><rect x="6" y="6" width="116" height="116" rx="24"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- felt tile, thin gold rim -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#felt)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <g clip-path="url(#tile)">
  <!-- back card: red heart -->
  <g filter="url(#shadow)" transform="rotate(-13 52 104)">
    <rect x="22" y="22" width="62" height="86" rx="8" fill="#fbfaf4" stroke="#c9a33a" stroke-width="2"/>
    <path transform="translate(4 2)" d="M30 36c0-4 3-6.5 6-6.5 2.3 0 4 1.3 5 3 1-1.7 2.7-3 5-3 3 0 6 2.5 6 6.5 0 6-7 10.5-11 14.5-4-4-11-8.5-11-14.5z" fill="#d32f2f"/>
  </g>

  <!-- front card: ace of spades -->
  <g filter="url(#shadow)" transform="rotate(9 76 104)">
    <rect x="44" y="16" width="62" height="88" rx="8" fill="#ffffff" stroke="#c9a33a" stroke-width="2"/>
    <text x="51" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#111">A</text>
    <path transform="translate(75 62) scale(1.55) translate(-64 -57)"
          d="M64 41c4.8 6.2 12.8 10.4 12.8 17.6 0 4.6-3.6 7.6-7.4 7.6-2.2 0-3.9-.9-4.9-2.3.5 3.6 1.9 6 4.4 8.1H59.1c2.5-2.1 3.9-4.5 4.4-8.1-1 1.4-2.7 2.3-4.9 2.3-3.8 0-7.4-3-7.4-7.6C51.2 51.4 59.2 47.2 64 41z"
          fill="#111"/>
  </g>

  </g>

  <!-- gold scoring chip -->
  <g filter="url(#shadow)">
    <circle cx="97" cy="98" r="22" fill="url(#gold)" stroke="#8a6a12" stroke-width="2"/>
    <circle cx="97" cy="98" r="16.5" fill="none" stroke="#6e540c" stroke-width="2.4" stroke-dasharray="5 4"/>
    <text x="97" y="106.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#2e2104">P</text>
  </g>
</svg>
